<!DOCTYPE html>

<body class="screen-body">
  <div class="banner">Expert · Setup ·  <a href="expert-02-assumptions-liquid-glass.html">Assumptions →</a>

  <div class="window expert-window">
    <header class="header liquid">
      <div class="header-left">
        <span class="app-name">Retirement Planner</span>
        <div class="pill-toggle">
          <button type="button">Guided</button>
          <button type="button" class="on">Expert</button>
        </div>
      </div>
      <span class="build">UI Jun 23 · liquid glass</span>
    </header>

    <div class="expert-body">
      <nav class="section-rail liquid" aria-label="Sections">
        <span class="rail-label">Sections</span><button type="button" class="rail-link on">Setup</button><button type="button" class="rail-link">Assumptions</button><button type="button" class="rail-link">AI Assistant</button><button type="button" class="rail-link">Live Data</button><button type="button" class="rail-link">Simulate</button><button type="button" class="rail-link">Settings</button>
