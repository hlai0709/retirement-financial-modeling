<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Retirement Planner</title>
  <link rel="stylesheet" href="liquid-glass.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
    }
    body.screen-body {
      min-height: 0;
      height: 100%;
      padding: 0;
      background-attachment: scroll;
      /* Keep HTML content below the native title bar / traffic lights */
      -webkit-app-region: no-drag;
    }
    #app {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 2px 10px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .boot-loading {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.62);
      padding: 24px;
    }
    .boot-error {
      max-width: 520px;
      margin: 24px;
      padding: 22px 26px;
      border-radius: 18px;
      background: rgba(255, 80, 80, 0.12);
      border: 1px solid rgba(255, 120, 120, 0.3);
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.55;
      font-size: 13px;
    }
    #app .window {
      width: min(980px, 100%);
      height: min(740px, 100%);
      max-width: calc(100% - 12px);
      max-height: calc(100% - 12px);
      flex-shrink: 1;
    }
    .select-wrap::after {
      content: "";
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid rgba(255,255,255,0.5);
      pointer-events: none;
    }
    .glass-input.year { width: 108px; }
    .caption.tight { margin-top: 10px; }
    .caption.loose { margin-top: 28px; }
    .dots i { width: 14px; }
    .optional-tag {
      font-size: 10px; color: var(--muted);
      margin-left: 6px; font-weight: 400;
    }
    .ai-card {
      position: relative;
      text-align: left;
      padding: 24px 28px 28px 84px;
    }
    .ai-card p { font-size: 14px; color: var(--secondary); margin-bottom: 20px; line-height: 1.55; }
    .ai-actions {
      display: flex;
      justify-content: center;
      margin: 4px calc(-28px) 0 calc(-56px);
    }
    .ai-icon {
      position: absolute;
      top: 22px;
      left: 22px;
      width: 48px; height: 48px;
      margin: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(90,200,250,0.35), rgba(175,82,222,0.25));
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .btn-skip-prominent {
      background: rgba(255,255,255,0.16) !important;
      border-color: rgba(255,255,255,0.28) !important;
    }
    .radio-pill { cursor: pointer; user-select: none; }
    .pill-toggle button { cursor: pointer; }
    .input-suffix {
      display: inline-flex; align-items: center; gap: 8px;
    }
    .input-suffix .suffix {
      font-size: 15px; font-weight: 500; color: var(--muted);
    }
    .connect-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .expert-placeholder {
      max-width: 640px;
      margin-left: 4px;
      padding: 32px 28px;
      text-align: center;
      color: var(--secondary);
      line-height: 1.55;
      font-size: 14px;
    }
  </style>
</head>
<body class="screen-body">
  <div id="app"><div class="boot-loading">Loading your plan…</div></div>
  <script src="live-app.js"></script>
</body>
</html>
